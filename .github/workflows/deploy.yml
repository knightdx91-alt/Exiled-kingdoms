# Publishes the Exiled Kingdoms web rebuild (web/) to GitHub Pages on every push
# to main. The web game is fully static — Phaser is vendored and all assets are
# committed under web/ — so there's no build step; we upload web/ as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Mod APKs over GitHub's 100MB git limit live in dist/ as split parts;
      # reassemble them into the published site so the owner gets a single
      # direct download link (Pages artifact deploys have no per-file limit).
      - name: Assemble mod APKs into site
        run: |
          mkdir -p web/dist
          for d in dist/*/; do
            name=$(basename "$d")
            if ls "$d"*.part00 >/dev/null 2>&1; then
              base=$(basename "$d"*.part00 .part00)
              cat "$d$base".part?? > "web/dist/$base"
              ls -la "web/dist/$base"
            fi
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
